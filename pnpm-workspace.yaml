packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  prisma: true
  '@scarf/scarf': false # telemetry
  msgpackr-extract: true
minimumReleaseAgeExclude:
