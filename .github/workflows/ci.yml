name: CI
on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: avt, POSTGRES_PASSWORD: avt, POSTGRES_DB: avt }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U avt" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://avt:avt@localhost:5432/avt
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @avt/db generate
      - run: pnpm --filter @avt/db migrate:deploy
      - run: pnpm turbo run typecheck --filter=!@avt/web && pnpm test
      - run: pnpm --filter @avt/web typecheck
